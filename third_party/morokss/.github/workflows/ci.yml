name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test Go with the race detector
        run: go test -race ./...

      - name: Vet Go
        run: go vet ./...

      - name: Fuzz protocol parsers
        run: |
          go test ./cmd/morokss-client -run=^$ -fuzz=FuzzUnpackEnvelope -fuzztime=5s -parallel=2
          go test ./cmd/morokss-client -run=^$ -fuzz=FuzzReadHTTPHead -fuzztime=5s -parallel=2
          go test ./cmd/morokss-client -run=^$ -fuzz=FuzzReadWebSocketFrame -fuzztime=5s -parallel=2

      - name: Test Python and the cross-language tunnel
        env:
          MOROKSS_RUN_GO_TESTS: "1"
        run: python -m unittest discover -s tests -v
