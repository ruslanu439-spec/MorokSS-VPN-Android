plugins {
    id "com.android.application"
}

android {
    namespace "com.morokss.android"
    compileSdk 35

    defaultConfig {
        applicationId "com.morokss.android"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.3.1"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("MOROKSS_ANDROID_KEYSTORE")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("MOROKSS_ANDROID_STORE_PASSWORD")
                keyAlias System.getenv("MOROKSS_ANDROID_KEY_ALIAS") ?: "morokss"
                keyPassword System.getenv("MOROKSS_ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("MOROKSS_ANDROID_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
